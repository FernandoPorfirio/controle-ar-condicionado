# Compila o instalador do Windows e publica uma release a cada tag v*.
# O instalador também fica como artefato da execução, caso a release falhe.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # Usa a seção da versão no CHANGELOG.md como texto da release.
      - name: Notas da versão
        id: notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo 'text<<EOF_NOTES'
            awk -v v="$version" '/^## \[/ { p = index($0, "[" v "]") > 0; next } /^\[.*\]: / { next } p' CHANGELOG.md
            echo 'EOF_NOTES'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Ar-condicionado ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: |
            ${{ steps.notes.outputs.text }}

            ---

            **Instalar:** baixe o `Ar-condicionado_…_x64-setup.exe` em *Assets*, logo abaixo, e rode.
            O Windows pode avisar "O Windows protegeu o computador": clique em **Mais informações → Executar assim mesmo**.

            Na primeira vez, o app pede o token da sua conta LG. O passo a passo está no [README](https://github.com/${{ github.repository }}#configuração).
          releaseDraft: false
          prerelease: false

      - uses: actions/upload-artifact@v4
        with:
          name: instalador-windows
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
