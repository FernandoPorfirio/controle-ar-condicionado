[package]
name = "ar-condicionado"
version = "0.5.0"
description = "Controle do ar-condicionado LG ThinQ pela bandeja do Windows"
authors = ["Fernando L. Porfirio"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash between the lib and the bin on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "ar_condicionado_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
dotenvy = "0.15"
sys-locale = "0.3"
keyring = { version = "3", features = ["windows-native"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
